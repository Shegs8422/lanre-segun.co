<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Olanrewaju Oluwasegun (Segun) — Design Engineer specializing in Web3, Fintech, and SaaS. Bridging design and engineering with HCD, accessibility, and premium UI." />
    <meta name="author" content="Olanrewaju Oluwasegun" />
    <meta property="og:title" content="Segun — Design Engineer" />
    <meta property="og:description" content="Portfolio of Segun (Lanre Segun), Design Engineer working across Web3, Fintech, and SaaS." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fffdf3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#13120d" />
    <title>Segun — Design Engineer</title>
    <script>
      try {
        var t = localStorage.getItem("segun-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
