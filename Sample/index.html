<!-- Keep the private editor out of search: add a noindex meta ONLY on /editor
     (or ?edit) so it never gets indexed, without touching the rest of the site.
     Runs at head-parse time; Google renders JS so it sees the tag. Paired with
     robots.txt Disallow: /editor. -->
<script type="text/javascript" async="" src="js/array.js"></script><script>try{if(location.pathname.replace(/\/$/,'')==='/editor'||new URLSearchParams(location.search).has('edit')){var _r=document.createElement('meta');_r.name='robots';_r.content='noindex, nofollow';document.head.appendChild(_r);}}catch(e){}</script>
<script>

     preference switches to the light look */
  if(localStorage.getItem('theme-pref')==='light'){document.documentElement.classList.add('mode-light');}
  else{document.documentElement.setAttribute('data-theme','dark');}
}catch(e){document.documentElement.setAttribute('data-theme','dark');}
</script>

<!-- Two preconnects, both for the FONT FILE hosts — those are the origins the
     browser discovers late (only after each font CSS arrives). The CSS hosts
     need no preconnect: their preload links below open the connection at the
     same instant a preconnect would. More than ~4 preconnects is a net loss —
     every TLS handshake competes with the render-blocking CSS for slow-4G
     bandwidth, and Lighthouse flags it. -->
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin="">
<!-- Load the font stylesheet WITHOUT blocking first paint: preload it as a
     stylesheet, then flip rel→stylesheet once it arrives. `display=swap` (in the
     URL) means text shows in the fallback face immediately and swaps in General
     Sans when ready, so there's no invisible-text flash. <noscript> keeps it
     working with JS disabled. -->
<link rel="preload" as="style" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&amp;display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" /></noscript>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<!-- The mono face, same pattern. This was an @import inside site.css, which
     held first paint for a fetch the browser couldn't even start until the
     main stylesheet had arrived. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" /></noscript>

<script async="" src="https://www.googletagmanager.com/gtag/js?id=G-3NT5LFZ30V"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-3NT5LFZ30V');
</script>
